          "<b>«تعذّرت قراءة الرد» عند الترتيب</b>: انسخ الرد بزر النسخ في المنصة، لا بتحديده بالماوس.",
          "<b>لم يُحدَّث ملف Word</b>: أغلق الملف في Word ثم اضغط «تحديث الملفات».",
          "<b>توقّف الترتيب أو الترجمة التلقائية</b>: يكتب البرنامج السبب تحت الزر. «طلبات كثيرة» انتظر دقيقة، و«انتهت الحصة اليومية» حاول غداً، و«الخدمة مزدحمة» حاول بعد قليل. الأجزاء المترجمة محفوظة، والمحاولة التالية تكمل من حيث توقف.",
          "<b>لا تظهر الترجمة في المشغّل</b>: شغّل نسخة <code>… - Arabic subtitles.mkv</code> المدموجة، أو اختر الترجمة من قائمة Subtitle في VLC، وتأكد أن ملف SRT بجانب الفيديو ويبدأ اسمه باسم الفيديو.",
          "<b>لا يصل التحديث</b>: اضغط ⚙ ← «التحقق من التحديثات». إن قال «تعذّر الوصول إلى GitHub» فقد يمنعه برنامج حماية أو شبكة عمل؛ نزّل أحدث إصدار من الموقع وثبّته فوق القديم، ومكتبتك تبقى كما هي.",
          "لأي مشكلة أخرى: <a href=\"mailto:nasikh.app@gmail.com\">nasikh.app@gmail.com</a>."
        ], [], []]
      ]
    },
    en: {
      page: "User guide · Nasikh", name: "Nasikh", home: "Home", download: "Download", toc: "Contents",
      title: "Nasikh user guide", lead: "Everything you need to know, step by step, with pictures from the program.",
      by: "Created by", rate: "Rate Nasikh", top: "↑ Back to top",
      sections: [
        ["start", "Getting started", "Installing the program and setting it up the first time.", "", [
          "Download the program from the <a href=\"./\">home page</a>, run the file and choose the program's language.",
          "If you see “Windows protected your PC”, click <b>More info</b>, then <b>Run anyway</b>.",
          "On first start the <b>“Setting up Nasikh”</b> screen appears: the program downloads the transcription model (1.5 GB) once. If your computer has an NVIDIA card, also choose <b>Graphics card acceleration</b> (1.4 GB).",
          "If the internet drops during the download, click “Try again”: it continues where it stopped.",
          "A short tour follows; you can replay it from the settings ⚙."
        ], [], []],
        ["transcribe", "Transcribing", "From a recording to written text.", "transcribe", [
          "Drop audio or video files onto <b>“Drop files here”</b>, or click <b>“Browse files”</b>. You can add several files at once.",
          "Numbered parts of one lecture (such as “Lesson 2a” and “Lesson 2b”) are merged into one lecture automatically.",
          "Choose the <b>recording language</b>, or leave it on “Automatic” for the program to detect it.",
          "Choose the mode: <b>“Accurate”</b> is best for lectures; <b>“Fast”</b> is twice as fast, slightly less accurate.",
          "Choose the output formats: Word, plain text and timed text for video (SRT).",
          "Click <b>“Start transcribing”</b> and watch the text being written in “Live transcript”. You can stop at any moment."
        ], [
          "In <b>“Names and terms”</b>, write the names and terms used in the lecture, separated by commas, and the program fixes their spelling after transcription.",
          "With an NVIDIA card an hour-long lecture takes minutes; on the CPU alone it takes longer."
        ], []],
        ["report", "Quality report", "Notes about the recording and the text that show what is worth checking.", "report", [
          "Open the <b>“Quality report”</b> tab once transcription ends.",
          "Each note gives its time: listen to that moment in the “Text” tab by clicking the line itself.",
          "If the program removed a repeated phrase that the speaker really said, click <b>“Put it back: the speaker said it”</b>.",
          "Notes cover: corrected names, long silences, low volume, uncertain words and damaged parts of the file."
        ], [], []],
        ["editor", "Listening and correcting", "Check the text while you listen to the recording.", "editor", [
          "Open the lecture from the <b>Library</b> and press play ▶. The spoken word lights up as you listen.",
          "Click any word to hear it from there, use the 5-second buttons to go back and forward, and change the speed from the menu.",
          "“Highlight uncertain words” marks the words that may need correcting.",
          "Click <b>“Correct text”</b>, click any line and edit it, then <b>“Done correcting”</b>.",
          "After corrections a “You corrected the text…” bar appears: click <b>“Update files”</b> so the program updates the Word and text files."
        ], [], ["If you edited the Word file yourself in Word, the program never writes over it, to keep your changes."]],
        ["organize", "Organizing the Word file with AI", "Splits the lecture into titled sections without changing a word of the text.", "organize", [
          "Open the <b>“Organize Word file”</b> tab, choose <b>“Manual (copy and paste)”</b> at its top, then the options: number of sections and language of the titles, plus a note if you like.",
          "Click <b>“Copy prompt”</b>.",
          "Open a <b>new chat</b> in Gemini, ChatGPT or any AI, paste the prompt and send it.",
          "Copy the AI's answer <b>with the copy button above the answer</b> (don't select it with the mouse) and paste it into the third box.",
          "The program lists the sections it found, each marked “Matched” or “Approximate”.",
          "Click <b>“Create organized Word file”</b>: the file is named after the lecture's title, and the unorganized copy goes to the Recycle Bin."
        ], [
          "The AI only suggests the titles and where sections start; the text in the Word file is the transcript itself, 100%.",
          "If the titles come out in another language than the lecture's, set “Heading language” yourself and copy the prompt again."
        ], []],
        ["translate", "Translation", "Translating the lecture into 9 languages with AI, keeping its sections.", "translate", [
          "Open the <b>“Translate”</b> tab, choose <b>“Manual (copy and paste)”</b> at its top and <b>“Word document”</b> under <b>“Translation type”</b> (for a film, see “Film and video subtitles”), then the language in <b>“Translate into”</b>.",
          "The lecture is split into parts (about a thousand words each) because free AI chats cut long answers short.",
          "For each part: click <b>“Copy prompt”</b>, paste it into a <b>new chat</b>, then copy the whole answer with the copy button and paste it into the part's box.",
          "Every part you paste is saved automatically, so you can finish later. <b>“Clear”</b> empties a part if you want to redo it.",
          "When all parts are in, click <b>“Create translated Word file”</b>."
        ], [
          "Copy the answer <b>whole, with the list of names</b> at its end (after @@@): the program uses it to spell names the same way in every part, and it does not appear in the Word file.",
          "In “Extra note” you can write how names should be spelled, for example: “write: cathedral, Lugdunum”.",
          "Use the strongest model of the AI (such as Pro or Thinking) for a more accurate translation."
        ], ["If a part shows a warning (wrong language, much shorter than the original, or a missing section title), ask the AI to translate it again."]],
        ["ai", "Organize and translate in one click", "Instead of copying and pasting, the program sends the text to the AI with your own key and gets the answer back by itself.", "ai", [
          "Open ⚙ → <b>“AI”</b> and choose <b>Gemini</b>, <b>ChatGPT</b> or <b>Claude</b>.",
          "Click <b>“Get a key”</b>: the provider's page opens. For Gemini, sign in with a Google account, then <b>Get API key</b> → <b>Create API key</b>, and copy the key.",
          "Paste the key and click <b>“Check and save”</b>. The program checks it and picks the fastest model working right now (up to half a minute).",
          "In “Organize Word file” or “Translate”, choose <b>“Automatic with Gemini”</b> at the top, then click <b>“Organize automatically”</b> or <b>“Translate all parts”</b>. The button shows the time spent; click it to stop. The program remembers your choice.",
          "Checking stays the same: the list of sections, the translation warnings, then creating the Word file."
        ], [
          "<b>Gemini is free</b>: a Google account is enough. The free plan has a daily request limit, and Google may use the text sent to improve its services. Organizing takes about a minute, and each translated part about half a minute.",
          "<b>ChatGPT and Claude need paid credit</b> in the provider's developer account; a ChatGPT Plus or Claude Pro subscription does not include it.",
          "Only the lecture's text is sent; the recording never leaves your computer. The key is kept in the Windows Credential Manager."
        ], ["If a model doesn't answer or is busy, the program switches to another one by itself. You can also choose the model in the “AI” window."]],
        ["films", "Film and video subtitles", "Subtitles timed line by line, to put next to the video or inside it.", "clip:film", [
          "Transcribe the video as usual. For a film in English there is no need for “English text timed for video”.",
          "Open the <b>“Translate”</b> tab and choose <b>“Video subtitles (SRT)”</b> (picked by itself for video files), then the language under “Translate into”.",
          "Translate the parts automatically with Gemini, or by hand with copy and paste. Each line is translated and keeps its time.",
          "Click <b>“Create the subtitle file (SRT)”</b>: it is named after the video, like <code>film.ar.srt</code>, so the player loads it when it sits next to the video.",
          "Or click <b>“Put the subtitles inside the video”</b>: an MKV copy with the translation and the original text, where the subtitles show by themselves. It is fast and keeps the picture and sound as they are."
        ], [
          "<b>“Two languages”</b>: the original sentence in italics under the translation, useful for learning a language.",
          "Lines are cut to be easy to read: two lines at most, and Arabic punctuation in the right place in VLC and on TVs.",
          "If two subtitle files sit next to the video (the original and the translation), VLC may show the original: pick the translation in the <b>Subtitle</b> menu, or use the copy with the subtitles inside."
        ], ["If the AI's answer leaves lines out, the program flags that part: translate it again."]],
        ["library", "Library and search", "All your lectures in one place.", "", [
          "Click <b>“Library”</b> at the top to see every transcribed lecture.",
          "Type any word in the search box: matches from all lectures appear, and clicking one takes you to that moment.",
          "The pencil ✏ renames a lecture, and × removes it from the library (the Word files and the original recording are not deleted).",
          "<b>“Open Word file”</b>, <b>“Open folder”</b> and <b>“Copy text”</b> are below the text."
        ], [], []],
        ["settings", "Settings", "The ⚙ button at the top.", "settings", [
          "<b>Language</b>: Arabic, English or French.",
          "<b>Appearance</b>: automatic (follows Windows), light or dark.",
          "<b>Where files are saved</b>: next to the original recording, or click “Choose folder…” to save every new file in one folder.",
          "<b>AI</b>: link your key (Gemini, ChatGPT or Claude) and pick the model; the linked service is shown next to it.",
          "<b>What's new</b> shows short clips of the version's features, <b>User guide</b> opens this page, and <b>Quick tour</b> replays the tour.",
          "When a new version is out, a dot appears on ⚙ with an “A new version is available” notice: click “Update now”. Your library and settings stay as they are. The program looks for updates when it opens and every 6 hours, and you can look yourself with <b>“Check for updates”</b>."
        ], [], []],
        ["tips", "Tips for the best result", "", "", [
          "Put the phone <b>close to the speaker</b>: distance and noise are what lower accuracy the most.",
          "Record the whole lecture in one file if you can; if it is split, number the parts so the program merges them.",
          "Write rare names in “Names and terms” before transcribing.",
          "Listen to the places the quality report points to."
        ], [], []],
        ["help", "Troubleshooting", "", "", [
          "<b>Transcription is very slow</b>: check that graphics card acceleration is on (the green box under the settings names the card). Without it the program runs on the CPU.",
          "<b>The text is in a strange language</b>: choose the recording language yourself instead of “Automatic” and transcribe again.",
          "<b>“Couldn't read this reply” when organizing</b>: copy the answer with the AI's copy button, not by selecting it with the mouse.",
          "<b>The Word file was not updated</b>: close it in Word, then click “Update files”.",
          "<b>Automatic organizing or translating stopped</b>: the reason is written under the button. “Too many requests”: wait a minute; “daily quota used up”: try tomorrow; “service crowded”: try again shortly. Translated parts are saved, and the next try continues where it stopped.",
          "<b>The subtitles don't show in the player</b>: play the <code>… - Arabic subtitles.mkv</code> copy, or pick the subtitles in VLC's Subtitle menu, and check that the SRT file sits next to the video with a name starting like the video's.",
          "<b>The update doesn't arrive</b>: click ⚙ → “Check for updates”. If it says GitHub couldn't be reached, an antivirus or a work network may be blocking it: download the latest version from the website and install it over the old one; your library stays as it is.",
          "For anything else: <a href=\"mailto:nasikh.app@gmail.com\">nasikh.app@gmail.com</a>."
        ], [], []]
      ]
    },
    fr: {
      page: "Guide d'utilisation · Nasikh", name: "Nasikh", home: "Accueil", download: "Télécharger", toc: "Sommaire",
      title: "Guide d'utilisation de Nasikh", lead: "Tout ce qu'il faut savoir, étape par étape, avec des images du programme.",
      by: "Créé par", rate: "Noter Nasikh", top: "↑ Haut de page",
      sections: [
        ["start", "Pour commencer", "Installer le programme et le préparer la première fois.", "", [
          "Téléchargez le programme depuis la <a href=\"./\">page d'accueil</a>, lancez le fichier et choisissez la langue du programme.",
          "Si « Windows a protégé votre ordinateur » s'affiche, cliquez sur <b>Informations complémentaires</b>, puis <b>Exécuter quand même</b>.",
          "Au premier lancement, l'écran <b>« Préparation de Nasikh »</b> s'affiche : le programme télécharge une seule fois le modèle de transcription (1,5 Go). Si votre ordinateur a une carte NVIDIA, choisissez aussi <b>l'accélération par la carte graphique</b> (1,4 Go).",
          "Si internet coupe pendant le téléchargement, cliquez sur « Réessayer » : il reprend là où il s'est arrêté.",
          "Une courte visite suit ; vous pouvez la revoir depuis les réglages ⚙."
        ], [], []],
        ["transcribe", "Transcrire", "De l'enregistrement au texte écrit.", "transcribe", [
          "Déposez des fichiers audio ou vidéo sur <b>« Déposez vos fichiers ici »</b>, ou cliquez sur <b>« Parcourir »</b>. Vous pouvez en ajouter plusieurs à la fois.",
          "Les parties numérotées d'un même cours (comme « Cours 2a » et « Cours 2b ») sont fusionnées automatiquement.",
          "Choisissez la <b>langue de l'enregistrement</b>, ou laissez « Automatique » pour que le programme la détecte.",
          "Choisissez le mode : <b>« Précis »</b> est le meilleur pour les cours ; <b>« Rapide »</b> va deux fois plus vite, un peu moins précis.",
          "Choisissez les formats : Word, texte brut et texte minuté pour la vidéo (SRT).",
          "Cliquez sur <b>« Lancer la transcription »</b> et suivez le texte qui s'écrit dans « Transcription en direct ». Vous pouvez arrêter à tout moment."
        ], [
          "Dans <b>« Noms et termes »</b>, écrivez les noms et les termes du cours, séparés par des virgules : le programme corrige leur orthographe après la transcription.",
          "Avec une carte NVIDIA, un cours d'une heure prend quelques minutes ; sur le processeur seul, c'est plus long."
        ], []],
        ["report", "Rapport de qualité", "Des remarques sur l'enregistrement et le texte qui montrent ce qui mérite d'être vérifié.", "report", [
          "Ouvrez l'onglet <b>« Rapport de qualité »</b> une fois la transcription terminée.",
          "Chaque remarque indique son heure : écoutez ce moment dans l'onglet « Texte » en cliquant sur la ligne elle-même.",
          "Si le programme a supprimé une phrase répétée que l'orateur a vraiment dite, cliquez sur <b>« La remettre : l'orateur l'a dite »</b>.",
          "Les remarques portent sur : les noms corrigés, les longs silences, le volume faible, les mots incertains et les parties abîmées du fichier."
        ], [], []],
        ["editor", "Écouter et corriger", "Vérifiez le texte en écoutant l'enregistrement.", "editor", [
          "Ouvrez le cours depuis la <b>Bibliothèque</b> et appuyez sur lecture ▶. Le mot prononcé s'allume pendant l'écoute.",
          "Cliquez sur un mot pour l'écouter à partir de là, utilisez les boutons 5 secondes pour reculer et avancer, et changez la vitesse dans le menu.",
          "« Surligner les mots incertains » signale les mots qui peuvent demander une correction.",
          "Cliquez sur <b>« Corriger le texte »</b>, puis sur une ligne pour la modifier, puis <b>« Terminer la correction »</b>.",
          "Après correction, une barre « Vous avez corrigé le texte… » apparaît : cliquez sur <b>« Mettre à jour les fichiers »</b> pour que le programme mette à jour le Word et le texte."
        ], [], ["Si vous avez modifié vous-même le fichier dans Word, le programme ne l'écrase jamais, pour garder vos modifications."]],
        ["organize", "Organiser le Word avec l'IA", "Découpe le cours en sections titrées sans changer un mot du texte.", "organize", [
          "Ouvrez l'onglet <b>« Organiser le Word »</b>, choisissez <b>« Manuel (copier-coller) »</b> en haut, puis les options : nombre de sections et langue des titres, plus une remarque si vous voulez.",
          "Cliquez sur <b>« Copier l'invite »</b>.",
          "Ouvrez une <b>nouvelle conversation</b> dans Gemini, ChatGPT ou une autre IA, collez l'invite et envoyez-la.",
          "Copiez la réponse <b>avec le bouton copier au-dessus de la réponse</b> (sans la sélectionner à la souris) et collez-la dans la troisième case.",
          "Le programme liste les sections trouvées, chacune marquée « Trouvé » ou « Approximatif ».",
          "Cliquez sur <b>« Créer le Word organisé »</b> : le fichier porte le titre du cours, et la copie non organisée va à la corbeille."
        ], [
          "L'IA propose seulement les titres et le début des sections ; le texte du Word est la transcription elle-même, à 100 %.",
          "Si les titres sortent dans une autre langue que celle du cours, choisissez vous-même la « Langue des titres » et recopiez l'invite."
        ], []],
        ["translate", "Traduction", "Traduire le cours dans 9 langues avec l'IA, en gardant ses sections.", "translate", [
          "Ouvrez l'onglet <b>« Traduire »</b>, choisissez <b>« Manuel (copier-coller) »</b> en haut et <b>« Document Word »</b> dans <b>« Type de traduction »</b> (pour un film, voir « Sous-titres de films et de vidéos »), puis la langue dans <b>« Traduire en »</b>.",
          "Le cours est découpé en parties (environ mille mots chacune), car les IA gratuites coupent les longues réponses.",
          "Pour chaque partie : cliquez sur <b>« Copier l'invite »</b>, collez-la dans une <b>nouvelle conversation</b>, puis copiez toute la réponse avec le bouton copier et collez-la dans la case de la partie.",
          "Chaque partie collée est enregistrée automatiquement : vous pouvez finir plus tard. <b>« Effacer »</b> vide une partie pour la refaire.",
          "Quand toutes les parties sont là, cliquez sur <b>« Créer le Word traduit »</b>."
        ], [
          "Copiez la réponse <b>entière, avec la liste des noms</b> à la fin (après @@@) : le programme s'en sert pour écrire les noms de la même façon dans toutes les parties, et elle n'apparaît pas dans le Word.",
          "Dans « Remarque », vous pouvez préciser l'orthographe voulue des noms, par exemple : « écris : Lugdunum, Fourvière ».",
          "Utilisez le modèle le plus puissant de l'IA (comme Pro ou Thinking) pour une traduction plus précise."
        ], ["Si une partie affiche une alerte (mauvaise langue, beaucoup plus courte que l'original, ou titre de section manquant), demandez à l'IA de la retraduire."]],
        ["ai", "Organiser et traduire en un clic", "Au lieu de copier-coller, le programme envoie le texte à l'IA avec votre propre clé et récupère la réponse tout seul.", "ai", [
          "Ouvrez ⚙ → <b>« IA »</b> et choisissez <b>Gemini</b>, <b>ChatGPT</b> ou <b>Claude</b>.",
          "Cliquez sur <b>« Obtenir une clé »</b> : la page du fournisseur s'ouvre. Pour Gemini, connectez-vous avec un compte Google, puis <b>Get API key</b> → <b>Create API key</b>, et copiez la clé.",
          "Collez la clé et cliquez sur <b>« Vérifier et enregistrer »</b>. Le programme la vérifie et choisit le modèle le plus rapide du moment (jusqu'à une demi-minute).",
          "Dans « Organiser le Word » ou « Traduire », choisissez <b>« Automatique avec Gemini »</b> en haut, puis cliquez sur <b>« Organiser automatiquement »</b> ou <b>« Traduire toutes les parties »</b>. Le bouton affiche le temps écoulé ; cliquez dessus pour arrêter. Le programme garde votre choix.",
          "La vérification ne change pas : la liste des sections, les alertes de traduction, puis la création du Word."
        ], [
          "<b>Gemini est gratuit</b> : un compte Google suffit. Le forfait gratuit a une limite de requêtes par jour, et Google peut utiliser les textes envoyés pour améliorer ses services. L'organisation prend environ une minute, et chaque partie traduite environ une demi-minute.",
          "<b>ChatGPT et Claude nécessitent un crédit payant</b> sur le compte développeur du fournisseur ; l'abonnement ChatGPT Plus ou Claude Pro ne l'inclut pas.",
          "Seul le texte du cours est envoyé ; l'enregistrement ne quitte jamais votre ordinateur. La clé est gardée dans le Gestionnaire d'identification de Windows."
        ], ["Si un modèle ne répond pas ou est très sollicité, le programme passe tout seul à un autre. Vous pouvez aussi choisir le modèle dans la fenêtre « IA »."]],
        ["films", "Sous-titres de films et de vidéos", "Des sous-titres minutés ligne par ligne, à placer à côté de la vidéo ou à intégrer dedans.", "clip:film", [
          "Transcrivez la vidéo comme d'habitude. Pour un film en anglais, l'option « Texte anglais minuté pour la vidéo » est inutile.",
          "Ouvrez l'onglet <b>« Traduire »</b> et choisissez <b>« Sous-titres vidéo (SRT) »</b> (choisi tout seul pour les vidéos), puis la langue dans « Traduire en ».",
          "Traduisez les parties automatiquement avec Gemini, ou à la main par copier-coller. Chaque ligne est traduite et garde son minutage.",
          "Cliquez sur <b>« Créer le fichier de sous-titres (SRT) »</b> : il porte le nom de la vidéo, comme <code>film.fr.srt</code>, et le lecteur le charge s'il est à côté de la vidéo.",
          "Ou cliquez sur <b>« Intégrer les sous-titres dans la vidéo »</b> : une copie MKV avec la traduction et le texte original, où les sous-titres s'affichent tout seuls. C'est rapide et l'image et le son restent intacts."
        ], [
          "<b>« Deux langues »</b> : la phrase originale en italique sous la traduction, utile pour apprendre une langue.",
          "Les lignes sont découpées pour une lecture confortable : deux lignes au plus, et la ponctuation arabe à la bonne place dans VLC et sur les téléviseurs.",
          "Si deux fichiers de sous-titres sont à côté de la vidéo (l'original et la traduction), VLC peut afficher l'original : choisissez la traduction dans le menu <b>Sous-titres</b>, ou utilisez la copie intégrée."
        ], ["Si la réponse de l'IA omet des lignes, le programme signale la partie : retraduisez-la."]],
        ["library", "Bibliothèque et recherche", "Tous vos cours au même endroit.", "", [
          "Cliquez sur <b>« Bibliothèque »</b> en haut pour voir tous les cours transcrits.",
          "Tapez un mot dans la recherche : les passages de tous les cours s'affichent, et un clic vous amène au moment précis.",
          "Le crayon ✏ renomme un cours, et × le retire de la bibliothèque (les fichiers Word et l'enregistrement d'origine ne sont pas supprimés).",
          "<b>« Ouvrir le Word »</b>, <b>« Ouvrir le dossier »</b> et <b>« Copier le texte »</b> sont sous le texte."
        ], [], []],
        ["settings", "Réglages", "Le bouton ⚙ en haut.", "settings", [
          "<b>Langue</b> : arabe, anglais ou français.",
          "<b>Apparence</b> : automatique (comme Windows), claire ou sombre.",

  var PANELS = ["organize", "translate", "report", "settings", "ai"];  // one panel of the window, shown narrower

  function pickLang() {
    var m = /[?&]lang=(ar|en|fr)/.exec(location.search);
    if (m) return m[1];
    try { var saved = localStorage.getItem("nasikh-lang"); if (G[saved]) return saved; } catch (e) {}
    var nav = (navigator.language || "ar").slice(0, 2);
    return G[nav] ? nav : "ar";
  }

  function render(lang) {
    var g = G[lang], root = document.documentElement;
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = g.page;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = g[el.getAttribute("data-t")] || ""; });
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    var latin = lang === "ar" ? "" : "-latin";
    document.querySelectorAll("img.mark").forEach(function (im) { im.src = "img/icon" + latin + ".png"; });
    document.getElementById("favicon").href = "img/favicon" + latin + ".png";
    // the texts are written here, in this file: their HTML (links, bold) is trusted
    document.getElementById("toc").innerHTML = "<b>" + g.toc + "</b>" + g.sections.map(function (s, i) {
      return '<a href="#' + s[0] + '">' + (i + 1) + ". " + s[1] + "</a>";
    }).join("");
    document.getElementById("guide").innerHTML = g.sections.map(function (s, i) {
      return '<section id="' + s[0] + '"><h2><span class="n">' + (i + 1) + "</span>" + s[1] + "</h2>" +
        (s[2] ? '<p class="intro">' + s[2] + "</p>" : "") +
        (/^clip:/.test(s[3]) ? '<div class="shot"><video src="img/new-' + s[3].slice(5) + "-" + lang + '.mp4" poster="img/new-' + s[3].slice(5) + "-" + lang +
          '.jpg" muted loop playsinline autoplay preload="metadata" aria-label="' + s[1] + '"></video></div>' :
        s[3] ? '<div class="shot' + (PANELS.indexOf(s[3]) >= 0 ? " panel" : "") + '"><img src="img/shot-' + lang + "-" + s[3] +
          '.webp" alt="' + s[1] + '" loading="lazy"></div>' : "") +
        (s[4].length ? "<" + (s[0] === "tips" || s[0] === "help" || s[0] === "library" || s[0] === "settings" ? "ul" : "ol") + ">" +
          s[4].map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</" + (s[0] === "tips" || s[0] === "help" || s[0] === "library" || s[0] === "settings" ? "ul" : "ol") + ">" : "") +
        s[5].map(function (x) { return '<p class="tip">' + x + "</p>"; }).join("") +
        s[6].map(function (x) { return '<p class="warn">' + x + "</p>"; }).join("") +
        '<a class="back" href="#top">' + g.top + "</a></section>";
    }).join("");
    try { localStorage.setItem("nasikh-lang", lang); } catch (e) {}
    if (location.hash) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
    markToc();
  }

  function markToc() {
    var current = null;
    document.querySelectorAll("#guide section").forEach(function (s) { if (s.getBoundingClientRect().top < 140) current = s.id; });
    document.querySelectorAll("#toc a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + current); });
  }

  document.body.id = "top";
  var lang = pickLang();
  render(lang);
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.dataset.lang; render(lang); });
  });
  window.addEventListener("scroll", markToc, { passive: true });
})();
</script>
