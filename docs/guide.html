  var PANELS = ["organize", "translate", "report", "settings"];  // one panel of the window, shown narrower

  function pickLang() {
    var m = /[?&]lang=(ar|en|fr)/.exec(location.search);
    if (m) return m[1];
    try { var saved = localStorage.getItem("nasikh-lang"); if (G[saved]) return saved; } catch (e) {}
    var nav = (navigator.language || "ar").slice(0, 2);
    return G[nav] ? nav : "ar";
  }

  function render(lang) {
    var g = G[lang], root = document.documentElement;
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = g.page;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = g[el.getAttribute("data-t")] || ""; });
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    var latin = lang === "ar" ? "" : "-latin";
    document.querySelectorAll("img.mark").forEach(function (im) { im.src = "img/icon" + latin + ".png"; });
    document.getElementById("favicon").href = "img/favicon" + latin + ".png";
    // the texts are written here, in this file: their HTML (links, bold) is trusted
    document.getElementById("toc").innerHTML = "<b>" + g.toc + "</b>" + g.sections.map(function (s, i) {
      return '<a href="#' + s[0] + '">' + (i + 1) + ". " + s[1] + "</a>";
    }).join("");
    document.getElementById("guide").innerHTML = g.sections.map(function (s, i) {
      return '<section id="' + s[0] + '"><h2><span class="n">' + (i + 1) + "</span>" + s[1] + "</h2>" +
        (s[2] ? '<p class="intro">' + s[2] + "</p>" : "") +
        (s[3] ? '<div class="shot' + (PANELS.indexOf(s[3]) >= 0 ? " panel" : "") + '"><img src="img/shot-' + lang + "-" + s[3] +
          '.webp" alt="' + s[1] + '" loading="lazy"></div>' : "") +
        (s[4].length ? "<" + (s[0] === "tips" || s[0] === "help" || s[0] === "library" || s[0] === "settings" ? "ul" : "ol") + ">" +
          s[4].map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</" + (s[0] === "tips" || s[0] === "help" || s[0] === "library" || s[0] === "settings" ? "ul" : "ol") + ">" : "") +
        s[5].map(function (x) { return '<p class="tip">' + x + "</p>"; }).join("") +
        s[6].map(function (x) { return '<p class="warn">' + x + "</p>"; }).join("") +
        '<a class="back" href="#top">' + g.top + "</a></section>";
    }).join("");
    try { localStorage.setItem("nasikh-lang", lang); } catch (e) {}
    if (location.hash) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
    markToc();
  }

  function markToc() {
    var current = null;
    document.querySelectorAll("#guide section").forEach(function (s) { if (s.getBoundingClientRect().top < 140) current = s.id; });
    document.querySelectorAll("#toc a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + current); });
  }

  document.body.id = "top";
  var lang = pickLang();
  render(lang);
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.dataset.lang; render(lang); });
  });
  window.addEventListener("scroll", markToc, { passive: true });
})();
