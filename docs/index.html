<style>

  .wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }

  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 18px; height: 66px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-size: 23px; font-weight: 700; }

  nav.links { display: flex; gap: 20px; margin-inline-start: 12px; }

  nav.links a:hover { color: var(--ink); }
  .langs { margin-inline-start: auto; display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 18px; }
  .btn-main { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent); }

  .meta { font-size: 14px; color: var(--muted); }

  .card { padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }

  .card .ic svg { width: 22px; height: 22px; }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); font-size: 15.5px; }

  /* editor showcase */
  .show { display: grid; grid-template-columns: 1fr 1.5fr; gap: 36px; align-items: center; }
  .show h2, .show .lead { text-align: start; margin-inline: 0; }
  .show ul { margin: 0; padding-inline-start: 20px; color: var(--muted); }
  .show li { margin-bottom: 6px; }
  .show .shot { margin: 0; }

  /* steps */
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; counter-reset: step; }
  .step { position: relative; padding: 22px 20px 18px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
  .step::before { counter-increment: step; content: counter(step); position: absolute; top: -14px; inset-inline-start: 18px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; }

  .step p { margin: 0; color: var(--muted); font-size: 15px; }
  .note { margin-top: 18px; padding: 14px 18px; border-radius: 12px; background: var(--teal-soft); color: var(--ink); font-size: 15px; }
  .req { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 26px; }
  .req div { padding: 14px 16px; border-radius: 12px; border: 1px dashed var(--line); font-size: 15px; }
  .req b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }

  /* privacy */
  .privacy { text-align: center; max-width: 760px; margin-inline: auto; }
  .privacy .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
  .privacy .badges span { padding: 6px 14px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-weight: 600; font-size: 14.5px; }

  /* faq */
  .faq { max-width: 820px; margin-inline: auto; }
  details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); margin-bottom: 10px; }
  summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
  summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 22px; line-height: 1; }
  details[open] summary::after { content: "–"; }
  details p { margin: 0; padding: 0 18px 16px; color: var(--muted); }

  .count { font-size: 14px; color: var(--teal); font-weight: 600; }
  .feedback { text-align: center; }
  .feedback .btn { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-size: 17px; }
  .feedback .btn:hover { border-color: var(--accent); }
  .feedback .btn svg { color: var(--accent); }
  footer { padding: 36px 0 44px; text-align: center; color: var(--muted); font-size: 15px; }
  footer .credit { font-family: var(--font-display); font-size: 20px; color: var(--ink); }
  footer .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; }

  @media (max-width: 820px) {
    nav.links { display: none; }
    .show { grid-template-columns: 1fr; }
    .show h2, .show .lead { text-align: center; margin-inline: auto; }
  }
</style>
</head>

  // Set once the accounts exist (see packaging/github/WEBSITE.md).
  var CONFIG = {
    goatcounter: "nasikh",  // https://nasikh.goatcounter.com (private visitor statistics)
    feedback: "https://forms.gle/FH2LsjnkosEtTKuNA",  // Google Form (rating + comments), answers go to nasikh.app@gmail.com
    showDownloadsFrom: 100  // the download count appears on the page from this number (always with ?stats)
  };
  var release = null, downloads = 0;

  if (CONFIG.goatcounter) {  // cookie-free statistics, seen only by the site's owner
    var gc = document.createElement("script");
    gc.async = true;
    gc.src = "https://gc.zgo.at/count.js";
    gc.setAttribute("data-goatcounter", "https://" + CONFIG.goatcounter + ".goatcounter.com/count");
    document.head.appendChild(gc);
  }
  if (CONFIG.feedback) document.getElementById("fbBtn").href = CONFIG.feedback;

  function pickLang() {
    var m = /[?&]lang=(ar|en|fr)/.exec(location.search);
    if (m) return m[1];
    try { var saved = localStorage.getItem("nasikh-lang"); if (T[saved]) return saved; } catch (e) {}
    var nav = (navigator.language || "ar").slice(0, 2);
    return T[nav] ? nav : "ar";
  }

  function apply(lang) {
    var t = T[lang], root = document.documentElement;
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t.title;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")] || ""; });
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    // the logo letter follows the language, as in the program: ن in Arabic, N otherwise
    var latin = lang === "ar" ? "" : "-latin";
    document.querySelectorAll("img.mark").forEach(function (im) { im.src = "img/icon" + latin + ".png"; });
    document.getElementById("favicon").href = "img/favicon" + latin + ".png";
    document.getElementById("shotMain").src = "img/shot-" + lang + "-transcribe.webp";
    document.getElementById("shotMain").alt = t.tagline;
    document.getElementById("shotEditor").src = "img/shot-" + lang + "-editor.webp";
    document.getElementById("shotEditor").alt = t.edTitle;
    if (release) {
      var v = release.version.split("-");
      document.getElementById("dlMeta").textContent = t.meta.replace("{v}", v[0] + (v[1] ? " (" + t.beta + ")" : ""))
        .replace("{s}", Math.round(release.size / 1048576));
    }
    var count = document.getElementById("dlCount");
    count.hidden = !(downloads && (downloads >= CONFIG.showDownloadsFrom || /[?&]stats\b/.test(location.search)));
    count.textContent = t.downloads.replace("{n}", downloads.toLocaleString(lang === "ar" ? "en" : lang));
    if (!CONFIG.feedback) {
      document.getElementById("fbBtn").href = "mailto:nasikh.app@gmail.com?subject=" + encodeURIComponent(t.fbBtn + " · Nasikh");
    }
    try { localStorage.setItem("nasikh-lang", lang); } catch (e) {}
  }

  var lang = pickLang();
  apply(lang);
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.dataset.lang; apply(lang); });
  });

  // The download button points straight at the newest installer.
  // All releases at once: the newest one feeds the download button, all of them the count.
  fetch("https://api.github.com/repos/nasikh-app/nasikh/releases?per_page=100")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (list) {
      if (!list) return;
      var setup = function (rel) {
        return (rel.assets || []).filter(function (a) { return /^Nasikh-Setup-.*\.exe$/.test(a.name); })[0];
      };
      list.forEach(function (rel) { var a = setup(rel); if (a) downloads += a.download_count || 0; });
      var latest = list.filter(function (rel) { return !rel.draft && !rel.prerelease && setup(rel); })[0];
      if (latest) {
        var asset = setup(latest);
        document.getElementById("dl").href = asset.browser_download_url;
        release = { version: String(latest.tag_name).replace(/^v/, ""), size: asset.size };
      }
      apply(lang);
    })
    .catch(function () {});
})();
